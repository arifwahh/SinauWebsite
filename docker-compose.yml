services:
  postgres:
    image: postgres:15-alpine
    container_name: sinau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sinau_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      POSTGRES_DB: ${DB_NAME:-sinau_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinau_admin} -d ${DB_NAME:-sinau_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sinau_network

  redis:
    image: redis:7-alpine
    container_name: sinau_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sinau_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinau_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sinau_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      DB_NAME: ${DB_NAME:-sinau_db}
      REDIS_HOST: redis:6379
      JWT_SECRET: ${JWT_SECRET:?Isi JWT_SECRET di file .env}
      OFFLINE_KEY_MASTER: ${OFFLINE_KEY_MASTER:?Isi OFFLINE_KEY_MASTER di file .env}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sinau.id}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sinau_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: sinau_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sinau_network

volumes:
  postgres_data:

networks:
  sinau_network:
    driver: bridge
